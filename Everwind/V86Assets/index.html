<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Core Linux</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #screen_container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen_container > div {
    white-space: pre;
    font: 14px monospace;
    line-height: 14px;
    color: #0f0;
  }
  /* The canvas element's own box must match the rendered image, because v86
     maps the pointer with getBoundingClientRect(). "fit" scales the whole
     element while preserving its aspect ratio (thin bars on the long axis);
     "fill" stretches it to the screen. */
  #screen_container canvas {
    display: block;
    background: #000;
    flex: 0 0 auto;
  }
  #screen_container canvas.fit {
    max-width: 100%;
    max-height: 100%;
  }
  #screen_container canvas.fill {
    width: 100% !important;
    height: 100% !important;
    max-width: none;
    max-height: none;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8e8e8;
    font: 15px -apple-system, system-ui, sans-serif;
    text-align: center;
    padding: 24px;
    background: #000;
    z-index: 10;
  }
  #boot small { display: block; margin-top: 8px; color: #8a8a8a; }
  /* Hidden field used only to summon the iOS software keyboard. */
  #kb {
    position: absolute;
    left: -9999px;
    top: 0;
    opacity: 0;
    width: 1px;
    height: 1px;
  }
</style>
</head>
<body>
<div id="boot">Booting Tiny Core Linux&hellip;<small>x86 emulation via v86 &middot; no JIT</small></div>

<div id="screen_container">
  <div></div>
  <canvas></canvas>
</div>

<input id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

<script src="libv86.js"></script>
<script>
(function () {
  "use strict";

  var boot = document.getElementById("boot");
  var container = document.getElementById("screen_container");
  var kb = document.getElementById("kb");

  // A resolution that v86's VGA BIOS actually advertises. Xvesa silently
  // substitutes some unrelated mode (640x480, 800x600, ...) for anything else,
  // so matching the iPhone's 19.5:9 panel exactly is not possible - 16:9 is the
  // widest mode available, and 1280x720 is the lightest of those.
  var GUEST_WIDTH = 1280;
  var GUEST_HEIGHT = 720;

  var emulator = null;
  var fillScreen = true;

  function canvas() {
    return container.getElementsByTagName("canvas")[0];
  }

  function applyLayout() {
    var c = canvas();
    if (!c) return;
    if (fillScreen) {
      c.classList.remove("fit");
      c.classList.add("fill");
    } else {
      c.classList.remove("fill");
      c.classList.add("fit");
    }
  }

  // Called from Swift when the "fill screen" toolbar button is toggled.
  window.everwindSetFill = function (on) {
    fillScreen = !!on;
    applyLayout();
  };

  // v86 forwards raw pointer deltas in CSS pixels without accounting for the
  // on-screen scale of the canvas, so dragging drifts whenever the picture is
  // resized (it already did, since the guest is shrunk to fit). Rescale the
  // deltas so the guest cursor tracks the finger 1:1 in either layout.
  function fixPointerDeltas(emu) {
    var bus = emu && emu.bus;
    if (!bus || typeof bus.send !== "function") return;

    var send = bus.send.bind(bus);
    bus.send = function (name, args) {
      if (name === "mouse-delta" && args && args.length === 2) {
        var c = canvas();
        if (c && c.width > 0 && c.height > 0) {
          var rect = c.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            args = [
              args[0] * c.width / rect.width,
              args[1] * c.height / rect.height,
            ];
          }
        }
      }
      return send(name, args);
    };
  }

  function start() {
    if (typeof V86 === "undefined") {
      boot.textContent = "v86 runtime failed to load.";
      return;
    }
    try {
      emulator = new V86({
        wasm_path: "v86.wasm",
        memory_size: 128 * 1024 * 1024,
        vga_memory_size: 16 * 1024 * 1024,
        screen_container: container,
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        // Boot the kernel directly instead of letting the ISO's isolinux menu
        // run: that menu sits for 60 seconds before picking a default and gives
        // us no way to choose the Xvesa resolution. The CD is still attached so
        // the "cde" boot code can load the X/GUI extensions from it.
        bzimage: { url: "vmlinuz" },
        initrd: { url: "core.gz" },
        cdrom: { url: "TinyCore-11.0.iso" },
        cmdline: "loglevel=3 cde xvesa=" + GUEST_WIDTH + "x" + GUEST_HEIGHT + "x24",
        fastboot: true,
        autostart: true,
      });
      window.emulator = emulator;

      fixPointerDeltas(emulator);
      applyLayout();

      emulator.add_listener("emulator-ready", function () {
        boot.style.display = "none";
        applyLayout();
      });
      // The canvas is resized whenever the guest selects a video mode.
      emulator.add_listener("screen-set-size", applyLayout);
    } catch (err) {
      boot.textContent = "Failed to start: " + err;
    }
  }

  // Keep the software keyboard available for the guest. v86 listens for key
  // events on the document, so a focused (hidden) input is enough to make iOS
  // show its keyboard while still delivering keystrokes to the emulator.
  function focusKeyboard() { try { kb.focus(); } catch (e) {} }
  document.addEventListener("touchend", focusKeyboard, { passive: true });
  document.addEventListener("mouseup", focusKeyboard);
  kb.addEventListener("input", function () { kb.value = ""; });

  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
</script>
</body>
</html>
