name: iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build (simulator, unsigned)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v86 is the x86 emulator that lets Everwind boot Tiny Core Linux. It is
      # ~22 MB of JS/WASM + ISO, so it is downloaded here rather than committed.
      - name: Cache v86 emulator assets
        uses: actions/cache@v4
        with:
          path: |
            Everwind/V86Assets/libv86.js
            Everwind/V86Assets/v86.wasm
            Everwind/V86Assets/v86-fallback.wasm
            Everwind/V86Assets/seabios.bin
            Everwind/V86Assets/vgabios.bin
            Everwind/V86Assets/TinyCore-11.0.iso
          key: v86-assets-${{ hashFiles('scripts/fetch-v86-assets.sh') }}

      - name: Fetch v86 emulator assets
        run: |
          chmod +x scripts/fetch-v86-assets.sh
          ./scripts/fetch-v86-assets.sh
          ls -la Everwind/V86Assets

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || true
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Everwind.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Everwind.xcodeproj \
            -scheme Everwind \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Show project schemes
        run: xcodebuild -list -project Everwind.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Everwind.xcodeproj \
            -scheme Everwind \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-simulator.log | tail -n 60

      - name: Archive (unsigned device build)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Everwind.xcodeproj \
            -scheme Everwind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Everwind.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build-archive.log | tail -n 60

      - name: Verify v86 assets in app bundle
        run: |
          set -euo pipefail
          APP="build/Everwind.xcarchive/Products/Applications/Everwind.app"
          echo "Contents of $APP/V86Assets:"
          find "$APP/V86Assets" -maxdepth 1 -type f -print -exec ls -l {} \;
          test -f "$APP/V86Assets/index.html"
          test -f "$APP/V86Assets/libv86.js"
          test -f "$APP/V86Assets/v86.wasm"
          test -f "$APP/V86Assets/seabios.bin"
          test -f "$APP/V86Assets/vgabios.bin"
          test -f "$APP/V86Assets/TinyCore-11.0.iso"
          echo "v86 assets OK"

      - name: Package unsigned .ipa
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Everwind.xcarchive/Products/Applications/Everwind.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build -name '*.app' -type d
            exit 1
          fi

          STAGE="$PWD/artifacts"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qr "Everwind.ipa" Payload )

          ls -la "$STAGE"
          echo "ipa_path=$STAGE/Everwind.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Everwind-ipa
          path: artifacts/Everwind.ipa
          if-no-files-found: error
          retention-days: 14

      # Publishes (or updates) a "latest" release with a stable asset URL that
      # the VPS pulls from:
      #   https://github.com/heyskylo/Everwind-Plus/releases/latest/download/Everwind.ipa
      - name: Publish release (latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Everwind (latest build)
          body: |
            Automated build from ${{ github.sha }}.

            Install via the sideload repo: https://repo.gayfeet.lol
          files: artifacts/Everwind.ipa
          make_latest: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-simulator.log
            build-archive.log
          if-no-files-found: warn
          retention-days: 7
